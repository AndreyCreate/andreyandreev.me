<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Андрей Андреев</title>
<meta name="description" content="Андрей Андреев — личный сайт." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0E0E;--ink-3:#555;--ink-mute:#8A8A8A;--paper:#F4F0E8;--paper-2:#ECE6DA;--coral:#E86F4D;--line:#E6E3DD;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:96px 32px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:24px}
h1{font-size:clamp(48px,7vw,88px);font-weight:600;letter-spacing:-.03em;line-height:1.02;margin:0 0 24px}
h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.lede{font-size:20px;color:var(--ink-3);line-height:1.5;margin:0 0 48px;max-width:520px}
.links{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.link{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;background:#fff;text-decoration:none;color:var(--ink);transition:all .2s ease}
.link:hover{background:var(--paper-2)}
.link__title{font-size:18px;font-weight:600;letter-spacing:-.005em}
.link__desc{font-size:14px;color:var(--ink-mute);margin-top:2px}
.link__arrow{font-size:24px;color:var(--coral);font-family:'Instrument Serif',serif;font-style:italic}
.foot{margin-top:64px;font-size:13px;color:var(--ink-mute);font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">andreyandreev.me</span>
  <h1>Андрей <em>Андреев</em></h1>
  <p class="lede">Коуч предпринимателей. Автор курсов и практик. Создатель приложения Hey, Sash!</p>

  <nav class="links">
    <a href="/coaching/" class="link">
      <div>
        <div class="link__title">Коучинг</div>
        <div class="link__desc">Клиентские страницы и направления</div>
      </div>
      <span class="link__arrow">→</span>
    </a>
  </nav>

  <div class="foot">© 2026 · больше разделов скоро</div>
</div>
</body>
</html>
