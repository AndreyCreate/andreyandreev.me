<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Страница не найдена · Андрей Андреев</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0E8; --ink:#16150F; --ink-soft:#57544A; --ink-faint:#8B877A;
  --font-grotesk:'Golos Text','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--font-grotesk);-webkit-font-smoothing:antialiased}
.wrap{text-align:center;padding:24px}
.code{font:400 12px/1.5 var(--font-mono);letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint)}
h1{margin:12px 0 8px;font:600 clamp(32px,6vw,56px)/1.05 var(--font-grotesk)}
p{margin:0 0 24px;color:var(--ink-soft)}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, она переехала или адрес набран с опечаткой.</p>
  <a href="/">На главную</a>
</div>
</body>
</html>
